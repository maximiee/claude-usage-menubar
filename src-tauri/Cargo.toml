[package]
name = "claude-usage-menubar"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_usage_menubar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: nötig, um das Template-Icon zur Laufzeit zu dekodieren.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Positioniert das Popover unter dem Menüleisten-Symbol.
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls statt native-tls: vermeidet eine Abhaengigkeit von System-OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
chrono = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin LTO statt fat, und Parallelisierung statt codegen-units = 1:
# deutlich kürzere Buildzeit bei minimal grösserer Binärdatei. Für eine App,
# die alle 5 Minuten eine HTTP-Anfrage macht, ist Laufzeit kein Thema.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
